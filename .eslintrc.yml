env:
  node: true
  es2022: true
extends:
  - eslint:recommended
parser: "@typescript-eslint/parser"
parserOptions:
  ecmaVersion: latest
  sourceType: module
plugins:
  - "@typescript-eslint"
ignorePatterns:
  - build/
  - node_modules/
rules:
  no-undef: off
  no-unused-vars: off
  "@typescript-eslint/no-unused-vars":
    - error
    - argsIgnorePattern: "^_"
      varsIgnorePattern: "^_"
      ignoreRestSiblings: true
