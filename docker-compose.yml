services:
  supportbot:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - ./config:/bot/config
      - ./logs:/bot/logs
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: [rag]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
volumes:
  qdrant_data:
